[package]
name = "net"
version.workspace = true
edition.workspace = true

# QUIC transport (quinn + rustls). Only the `ring` crypto backend is enabled:
# aws-lc-rs needs cmake/NASM to build on Windows, so default features that
# would pull it in are disabled on every crate below.
[dependencies]
anyhow.workspace = true
protocol.workspace = true
pipeline.workspace = true
bytes = "1.12.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
socket2 = "0.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
