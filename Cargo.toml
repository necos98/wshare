[workspace]
resolver = "3"
members = [
    "crates/gpu",
    "crates/protocol",
    "crates/pipeline",
    "crates/capture",
    "crates/audio",
    "crates/codec",
    "crates/render",
    "crates/net",
    "crates/discovery",
    "crates/input",
    "crates/input_desktop",
    "crates/app",
    "crates/cli-shim",
    "crates/release",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
windows = "0.62.2"
# `#[implement]` (COM objects of the windows crate) names this crate; it is
# the one `windows` already builds on, nothing new is compiled.
windows-core = "0.62.2"
gpu = { path = "crates/gpu" }
protocol = { path = "crates/protocol" }
pipeline = { path = "crates/pipeline" }
capture = { path = "crates/capture" }
audio = { path = "crates/audio" }
codec = { path = "crates/codec" }
render = { path = "crates/render" }
net = { path = "crates/net" }
discovery = { path = "crates/discovery" }
input = { path = "crates/input" }
input_desktop = { path = "crates/input_desktop" }
release = { path = "crates/release" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
