[package]
name = "render"
version.workspace = true
edition.workspace = true

# Depends on `gpu` for the frame type, never on `codec`: the renderer shows
# any NV12 GpuFrame, whoever produced it.
[dependencies]
anyhow.workspace = true
gpu.workspace = true
pipeline.workspace = true
# Vector2 for Direct2D text origins (already in the lockfile via `windows`).
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
] }

# The end-to-end test decodes real frames with `codec` and needs a window.
[dev-dependencies]
codec.workspace = true
windows = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
