[package]
name = "render"
version.workspace = true
edition.workspace = true

# Depends on `gpu` for the frame type, never on `codec`: the renderer shows
# any NV12 GpuFrame, whoever produced it.
[dependencies]
anyhow.workspace = true
gpu.workspace = true
pipeline.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# The end-to-end test decodes real frames with `codec` and needs a window.
[dev-dependencies]
codec.workspace = true
windows = { workspace = true, features = [
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
